name: Publish Blogger article from GitHub Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Public Blogger article Issue number"
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue and publish to Blogger
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          WORKER_URL: "https://blogger-auto-publisher.imen2unisienne.workers.dev"
          BLOGGER_PUBLISH_TOKEN: ${{ secrets.BLOGGER_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${BLOGGER_PUBLISH_TOKEN}" ]]; then
            echo "::error::Missing repository Actions secret BLOGGER_PUBLISH_TOKEN."
            exit 1
          fi
          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          author="$(jq -r '.user.login // ""' <<< "${issue_json}")"
          state="$(jq -r '.state // ""' <<< "${issue_json}")"
          title="$(jq -r '.title // ""' <<< "${issue_json}")"
          body="$(jq -r '.body // ""' <<< "${issue_json}")"
          if [[ "${author}" != "${REPOSITORY_OWNER}" ]]; then
            echo "::error::Only issues created by the repository owner can be published."
            exit 1
          fi
          if [[ "${state}" != "open" ]]; then
            echo "::error::The selected Issue must be open and unused."
            exit 1
          fi
          if [[ "${title}" != "[BLOGGER-PUBLISH]"* ]]; then
            echo "::error::Issue title must begin with [BLOGGER-PUBLISH]."
            exit 1
          fi
          jq -e 'type == "object"
            and (.blogId | type == "string" and length > 0)
            and (.title | type == "string" and length > 0)
            and (.content | type == "string" and length > 0)
            and ((.labels // []) | type == "array")' <<< "${body}" >/dev/null
          payload="$(jq -c --argjson issue "${ISSUE_NUMBER}" '. + {sourceIssue: $issue}' <<< "${body}")"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "${WORKER_URL}/api/github/publish" \
            --header "Authorization: Bearer ${BLOGGER_PUBLISH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "${payload}")"
          if [[ "$(jq -r '.success // false' <<< "${response}")" != "true" ]]; then
            echo "::error::Worker did not confirm publication."
            jq . <<< "${response}"
            exit 1
          fi
          post_url="$(jq -r '.post.url // empty' <<< "${response}")"
          if [[ -z "${post_url}" ]]; then
            echo "::error::Publication response did not contain a Blogger URL."
            exit 1
          fi
          echo "Published successfully: ${post_url}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=closed \
            -f body="Published successfully to Blogger: ${post_url}. Article payload cleared from the current Issue body."
